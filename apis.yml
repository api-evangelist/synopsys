apis:
- aid: synopsys:coverity
  name: Synopsys Coverity REST API
  description: >-
    The Coverity Platform REST API provides programmatic access to Coverity static analysis results, project
    and stream management, defect management, and security findings. Coverity performs deep source code
    examination across 20+ programming languages and 70+ frameworks to detect critical quality and security
    defects.
  humanURL: https://community.synopsys.com/s/topic/0TO34000000LmwWGAS/rest-api
  baseURL: https://coverity.synopsys.com/api
  tags:
  - Static Analysis
